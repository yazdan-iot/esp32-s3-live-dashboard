; ============================================================================
; PlatformIO Project Configuration File
;
; Project: ESP32-S3 web dashboard for monitoring and LED control
; Board:   ESP32-S3-N8R2 (8MB flash / 2MB PSRAM)
; ============================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time, colorize

; LittleFS serves the frontend files (HTML/CSS/JS), so we use a partition
; scheme with enough filesystem space on this 8MB-flash board.
board_build.partitions   = default_8MB.csv
board_build.filesystem   = littlefs

; Enables onboard PSRAM (R2 = 2MB). ArduinoJson and HTTP response buffers
; use it to reduce pressure on the internal heap.
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0          ; disable Arduino core debug logs for a smaller/faster binary
    -D ARDUINOJSON_ENABLE_PSRAM=1  ; let ArduinoJson allocate from PSRAM

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0        ; JSON (de)serialization for the status API
    fastled/FastLED @ ^3.7.0              ; precise color control for the addressable LED
    ESP32Async/ESPAsyncWebServer @ ^3.6.0 ; async web server for non-blocking multi-client handling
    ESP32Async/AsyncTCP @ ^3.3.2          ; low-level non-blocking TCP dependency for ESPAsyncWebServer
